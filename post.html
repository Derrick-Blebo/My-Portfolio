    <!-- This is the container where the Javascript will inject the post data -->
    <article id="blog-post-container" class="pt-32 max-w-4xl mx-auto">
        <h1 id="post-title" class="post-title">Loading post...</h1>
        <p id="post-date" class="post-date"></p>
        <div id="post-content" class="post-content"></div>
    </article>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('id');

      if (postId) {
        fetch('posts.json')
          .then(response => {
            if (!response.ok) {
              throw new Error('Network response was not ok');
            }
            return response.json();
          })
          .then(posts => {
            const post = posts.find(p => p.id == postId);

            if (post) {
              document.getElementById('post-title').innerText = post.title;
              document.getElementById('post-date').innerText = post.date;
              document.getElementById('post-content').innerText = post.content;
              document.title = post.title;
            } else {
              document.getElementById('post-title').innerText = "Post not found";
              document.getElementById('post-content').innerText = "Sorry, the post you are looking for does not exist.";
            }
          })
          .catch(error => {
            console.error('Error fetching posts:', error);
            document.getElementById('post-title').innerText = "Error loading post";
          });
      } else {
        document.getElementById('post-title').innerText = "No post specified";
      }
    </script>
