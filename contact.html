<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Consultation | Derrick Blebo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    colors: {
                        bgPrimary: '#b91c1c', // Rich Crimson Red Background
                        bgSecondary: '#991b1b', // Deeper shade for cards/boxes
                        textPrimary: '#ffffff',
                        textSecondary: '#f1f5f9',
                        accentDark: '#7f1d1d',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #b91c1c; color: #ffffff; }
        .glass-nav { background: rgba(185, 28, 28, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .minimal-input {
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            background: transparent;
            border-radius: 0;
            padding: 12px 0;
            color: #ffffff;
            transition: border-color 0.3s;
        }
        .minimal-input:focus {
            outline: none;
            border-bottom-color: #ffffff;
        }
        .minimal-input option {
            background-color: #b91c1c;
            color: #ffffff;
        }
        ::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="antialiased overflow-x-hidden selection:bg-white selection:text-accent">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold tracking-tighter uppercase text-white">
                Derrick<span class="font-light text-white/70">Blebo.</span>
            </a>
            <div class="hidden md:flex space-x-8 text-sm font-medium text-white/90">
                <a href="index.html#about" class="hover:text-white transition-colors duration-300">About</a>
                <a href="index.html#achievements" class="hover:text-white transition-colors duration-300">Achievements</a>
                <a href="index.html#portfolio" class="hover:text-white transition-colors duration-300">Portfolio</a>
                <a href="index.html#brands" class="hover:text-white transition-colors duration-300">Brands</a>
                <a href="index.html#skills" class="hover:text-white transition-colors duration-300">Skills</a>
                <a href="blog.html" class="hover:text-white transition-colors duration-300">Blog</a>
            </div>
            <div class="hidden md:flex items-center space-x-4">
                <a href="contact.html" class="inline-flex items-center justify-center px-5 py-2.5 border border-white/30 text-sm font-medium rounded-full text-white bg-white/10 hover:bg-white hover:text-bgPrimary transition-all duration-300 shadow-md">
                    Book a consultation
                </a>
            </div>
        </div>
    </nav>

    <!-- Contact Layout Section -->
    <main class="pt-40 pb-24 max-w-7xl mx-auto px-6">
        
        <!-- Header Text -->
        <div class="mb-16 max-w-2xl">
            <h1 class="text-4xl md:text-5xl font-thin mb-4 tracking-tight text-white">Let's build something <span class="font-bold underline decoration-white/30 underline-offset-8">exceptional.</span></h1>
            <p class="text-white/80 font-light text-base">Fill out the details below to initiate a brand strategy session or engagement.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-16 items-start bg-black/10 p-8 md:p-12 rounded-3xl border border-white/10 shadow-2xl backdrop-blur-md">
            
            <!-- Left Side: Form -->
            <div class="lg:col-span-7">
                <form id="contact-form" action="https://formspree.io/f/moeeylyg" method="POST" class="space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-widest text-white/70 mb-2">Your Name *</label>
                            <input type="text" name="name" required class="w-full minimal-input text-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-widest text-white/70 mb-2">Email *</label>
                            <input type="email" name="email" required class="w-full minimal-input text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-widest text-white/70 mb-2">Company or Brand</label>
                            <input type="text" name="company" class="w-full minimal-input text-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-widest text-white/70 mb-2">Engagement *</label>
                            <select name="engagement" class="w-full minimal-input text-sm">
                                <option value="Brand Audit & Strategy Session">Brand Audit & Strategy Session</option>
                                <option value="Visual Identity & Rebrand">Visual Identity & Rebrand</option>
                                <option value="Lead Generation & Marketing Campaign">Lead Generation & Marketing Campaign</option>
                                <option value="General Consultation">General Consultation</option>
                            </select>
