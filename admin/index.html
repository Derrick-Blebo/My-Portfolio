<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin Dashboard | Derrick Blebo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    colors: {
                        bgPrimary: '#f8fafc',
                        bgSecondary: '#ffffff',
                        textPrimary: '#0f172a',
                        textSecondary: '#475569',
                        accent: '#b91c1c',
                        accentHover: '#991b1b',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: theme('colors.bgPrimary'); color: theme('colors.textPrimary'); }
        .glass-nav { background: rgba(248, 250, 252, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
    </style>
    <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="antialiased overflow-x-hidden selection:bg-accent selection:text-white">

    <!-- Navigation Bar -->
    <nav class="fixed w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold tracking-tighter uppercase text-textPrimary">
                Derrick<span class="text-accent font-light">Blebo.</span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="blog.html" target="_blank" class="text-xs font-medium text-accent hover:underline">View Live Blog &rarr;</a>
                <button id="logout-btn" class="px-4 py-2 bg-gray-200 text-textPrimary text-xs font-bold rounded-lg hover:bg-gray-300 transition-colors">Sign Out</button>
            </div>
        </div>
    </nav>

    <!-- Admin Content -->
    <div class="max-w-2xl mx-auto pt-36 pb-20 px-6">
        <div class="bg-bgSecondary p-8 rounded-2xl border border-gray-100 shadow-sm mb-8">
            <div class="flex justify-between items-center mb-6">
                <h2 id="form-heading" class="text-lg font-bold text-textPrimary">Create New Post</h2>
                <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" class="hidden text-xs text-accent font-bold hover:underline">Cancel Edit</button>
            </div>
            <form id="admin-form" class="space-y-6">
                <input type="hidden" id="editing-post-id" value="">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-textSecondary mb-2">Post Title</label>
                    <input type="text" id="post-title-input" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-accent text-sm" placeholder="e.g., The Architecture of Strategy">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-textSecondary mb-2">Category</label>
                        <input type="text" id="post-category-input" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-accent text-sm" placeholder="e.g., Brand Strategy">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-textSecondary mb-2">Date</label>
                        <input type="date" id="post-date-input" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-accent text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-textSecondary mb-2">Featured Image URL (Optional)</label>
                    <input type="url" id="post-image-input" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-accent text-sm" placeholder="https://images.unsplash.com/photo-...">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-textSecondary mb-2">Article Body (Paragraphs)</label>
                    <textarea id="post-body-input" rows="8" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-accent text-sm" placeholder="Write your article paragraphs here..."></textarea>
                    <p class="text-[11px] text-gray-400 mt-1">Separate distinct paragraphs with a blank line.</p>
                </div>
                <button type="submit" id="submit-btn" class="w-full py-3 bg-accent text-white font-medium rounded-xl hover:bg-accentHover transition-all shadow-md">Publish Post</button>
            </form>
        </div>

        <div class="bg-bgSecondary p-8 rounded-2xl border border-gray-100 shadow-sm">
            <h2 class="text-lg font-bold mb-4 text-textPrimary">Existing Articles</h2>
            <div id="admin-posts-list" class="space-y-4">
                <p class="text-xs text-textSecondary">Loading articles...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        const SUPABASE_URL = 'https://wwawzrwxxsjdqbsqvagw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_JA5a5hh28iloEh3x4v8okg_mCgkR91m';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Security Check: Redirect to login if not signed in
        async function checkAuth() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
            } else {
                fetchPosts();
            }
        }
        checkAuth();

        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                await sb.auth.signOut();
            } catch (err) {
                console.error("Sign out error:", err);
            }
            window.location.href = 'login.html';
        });

        document.getElementById('post-date-input').valueAsDate = new Date();
        let allPosts = [];

        async function fetchPosts() {
            const { data, error } = await sb.from('posts').select('*').order('date', { ascending: false });
            if (error) {
                console.error('Error fetching posts:', error);
                return;
            }
            allPosts = data || [];
            renderAdminList();
        }

        function renderAdminList() {
            const listContainer = document.getElementById('admin-posts-list');
            listContainer.innerHTML = '';

            if (allPosts.length === 0) {
                listContainer.innerHTML = '<p class="text-sm text-textSecondary font-light">No articles published yet.</p>';
                return;
            }

            allPosts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-4 bg-bgPrimary rounded-xl border border-gray-100';
                item.innerHTML = `
                    <div class="pr-4">
                        <span class="text-[10px] uppercase font-bold text-accent tracking-wider">${post.category || 'Article'}</span>
                        <h3 class="font-bold text-sm text-textPrimary">${post.title}</h3>
                        <span class="text-xs text-textSecondary">${post.date}</span>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <button type="button" onclick="editPost('${post.id}')" class="px-3 py-1.5 bg-gray-200 text-textPrimary text-xs font-bold rounded-lg hover:bg-gray-300 transition-colors">Edit</button>
                        <button type="button" onclick="deletePost('${post.id}')" class="px-3 py-1.5 bg-red-100 text-accent text-xs font-bold rounded-lg hover:bg-red-200 transition-colors">Delete</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editingId = document.getElementById('editing-post-id').value;
            const title = document.getElementById('post-title-input').value;
            const category = document.getElementById('post-category-input').value;
            const date = document.getElementById('post-date-input').value;
            const image_url = document.getElementById('post-image-input').value;
            const rawBody = document.getElementById('post-body-input').value;

            const postData = {
                id: editingId || 'post-' + Date.now(),
                title,
                category,
                date,
                image_url,
                body: rawBody
            };

            const { error } = await sb.from('posts').upsert([postData]);

            if (error) {
                alert('Error saving post: ' + error.message);
            } else {
                alert(editingId ? 'Article updated successfully!' : 'Article published successfully!');
                cancelEdit();
                fetchPosts();
            }
        });

        window.editPost = function(id) {
            const post = allPosts.find(p => p.id === id);
            if (!post) return;

            document.getElementById('editing-post-id').value = post.id;
            document.getElementById('post-title-input').value = post.title;
            document.getElementById('post-category-input').value = post.category;
            document.getElementById('post-date-input').value = post.date;
            document.getElementById('post-image-input').value = post.image_url || '';
            document.getElementById('post-body-input').value = post.body || '';

            document.getElementById('form-heading').innerText = 'Edit Article';
            document.getElementById('submit-btn').innerText = 'Update Post';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEdit = function() {
            document.getElementById('admin-form').reset();
            document.getElementById('editing-post-id').value = '';
            document.getElementById('post-date-input').valueAsDate = new Date();
            document.getElementById('form-heading').innerText = 'Create New Post';
            document.getElementById('submit-btn').innerText = 'Publish Post';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        };

        window.deletePost = async function(id) {
            if (confirm('Are you sure you want to delete this article?')) {
                const { error } = await sb.from('posts').delete().eq('id', id);
                if (error) {
                    alert('Error deleting post: ' + error.message);
                } else {
                    fetchPosts();
                }
            }
        };
    })();
</script>
</body>
</html>
